name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.OPENCODE_PAT_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          MGC_PROSA_API_KEY: ${{ secrets.MGC_PROSA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          use_github_token: true
